<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロスピA計算ツール</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #d97706;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h2 {
            font-size: 1.3rem;
            color: var(--primary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1e40af;
        }
        .result-box {
            margin-top: 15px;
            background-color: #f8fafc;
            border-left: 5px solid var(--accent-color);
            padding: 15px;
            border-radius: 4px;
        }
        .result-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--primary-color);
        }
        .highlight {
            color: #d97706;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            background: #64748b;
        }
        .badge-s { background: #eab308; }
        .badge-a { background: #3b82f6; }
        .badge-b { background: #22c55e; }
        .title-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            background: #fff;
            margin-top: 10px;
        }
        .title-item {
            padding: 4px 0;
            border-bottom: 1px border-dashed #f1f5f9;
            font-size: 0.9rem;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 15px;
        }
        .toggle-container input[type="checkbox"] {
            width: auto;
            transform: scale(1.3);
            cursor: pointer;
        }
        .toggle-container label {
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
        }
        .note-text {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>

<div class="container">
    <h1>プロスピA計算ツール</h1>

   
    <div class="card">
        <h2>1. Vロード エナジー収支計算 </h2>

            <div class="form-group">
                <label>Vロード 難易度</label>
                <select id="vEnergyLevel">
                    <option value="1">★1 </option>
                    <option value="2">★2 </option>
                    <option value="3">★3 </option>
                    <option value="4">★4 </option>
                    <option value="5">★5 </option>
                    <option value="6">★6 </option>
                    <option value="7">★7 </option>
                    <option value="8" selected>★8 </option>
                </select>
            </div>
            <div class="form-group">
                <label>現在の日本一達成回数</label>
                <input type="number" id="vWinCount" value="0" min="0" placeholder="例: 0">
            </div>
        </div>
        <div class="form-group">
            <label>計算する周回数</label>
            <input type="number" id="vLaps" value="1" min="1">
        </div>

        <div class="toggle-container">
            <input type="checkbox" id="staminaHalf">
            <label for="staminaHalf">⚡ <strong>スタミナ半減キャンペーンを適用</strong> <small style="color:#64748b;">(1周38試合: 24.5エナジー換算／端数四捨五入)</small></label>
        </div>

        <button onclick="calcVEnergy()">収支・達成報酬を計算する</button>
        <div class="result-box" id="vEnergyResult">周回数と難易度を入力して計算ボタンを押してください。<br><small class="note-text">※ストーブリーグ等の不確定ランダム報酬は計算から除外しています。</small></div>
    </div>

    <!-- 2. Vロード 必要試合数計算 -->
    <div class="card">
        <h2>2. 選手育成 必要試合数＆周回計算</h2>
        <div class="form-row">
            <div class="form-group">

                </select>
            </div>
            <div class="form-group">
                <label>現在の選手レベル</label>
                <input type="number" id="currentLevel" value="1" min="1" max="70">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Vロード 難易度</label>

    <div class="card">

                <option value="2-3">ステータス2 ＆ ステータス3 の同値</option>

            </select>
        </div>

    </div>

        <div class="form-row">

                <select id="targetRankBorder">

                    <option value="1000" selected>1,000位以内</option>
                    <option value="3000">3,000位以内</option>
                    <option value="10000">10,000位以内</option>
                </select>
            </div>
            <div class="form-group">

            </div>
        </div>
        <div class="form-row">
            <div class="form-group">

            </div>
            <div class="form-group">

        </div>
        <div class="form-group">

        </div>

        <div class="result-box" id="predictResult">初日データと現在の数値を入力して予測してください。</div>
    </div>
</div>

    { name: "ミート自慢", star: 1, type: "野手", stats: { mee: 1, pow: 0, run: 0 } }
];

function updateMaxLevelLimit() {
    const rank = document.getElementById('playerRank').value;
    const currentLevelInput = document.getElementById('currentLevel');
    const maxLv = RANK_EXP_DATA[rank].maxLv;
    currentLevelInput.max = maxLv;
    if (parseInt(currentLevelInput.value) > maxLv) {
        currentLevelInput.value = maxLv;
    }
}

function calcVEnergy() {
    const level = parseInt(document.getElementById('vEnergyLevel').value);
    let winCount = parseInt(document.getElementById('vWinCount').value);
    const laps = parseInt(document.getElementById('vLaps').value);
    const isHalf = document.getElementById('staminaHalf').checked;

    const rawCostPerLap = isHalf ? 24.5 : 49;
    const rawTotalCost = rawCostPerLap * laps;
    const totalCost = Math.round(rawTotalCost);

    let totalWinReward = 0;
    const levelRewards = V_ROAD_WIN_REWARDS[level];

    for (let i = 1; i <= laps; i++) {
        let currentWin = winCount + i;
        let reward = 0;

        if (levelRewards.hasOwnProperty(currentWin)) {
            reward = levelRewards[currentWin];
        } else if (levelRewards.defaultRate && currentWin <= Math.max(...Object.keys(levelRewards).map(Number))) {
            reward = levelRewards.defaultRate;
        } else {
            reward = 0;
        }

        totalWinReward += reward;
    }

    let net = totalWinReward - totalCost;

    document.getElementById('vEnergyResult').innerHTML = `
        <div class="result-title">★${level} 周回結果 (${winCount}回達成 → ${winCount + laps}回達成) ${isHalf ? '<span class="badge badge-b">スタ半適用</span>' : ''}</div>
        消費エナジー: <b>${totalCost} エナジー</b> ${isHalf && (rawTotalCost % 1 !== 0) ? `<small style="color:#64748b;">(計算値: ${rawTotalCost} → 四捨五入)</small>` : ''}<br>
        確定・日本一達成報酬: <b>+${totalWinReward} エナジー</b><br>
        ------------------------------------------<br>
        確定実質収支: <span class="highlight" style="color: ${net >= 0 ? '#16a34a' : '#dc2626'};">
            ${net >= 0 ? '+' : ''}${net} エナジー
        </span><br>
        <small style="color:#64748b;">※契約書報酬の回はエナジー加算0として計算されています。</small>
    `;
}

function calcVMatches() {
    const rank = document.getElementById('playerRank').value;
    const curLv = parseInt(document.getElementById('currentLevel').value);
    const vLevel = parseInt(document.getElementById('vExpLevel').value);
    const bonus = parseFloat(document.getElementById('expBonus').value);
    const isHalf = document.getElementById('staminaHalfExp').checked;

    const rankData = RANK_EXP_DATA[rank];
    if (curLv >= rankData.maxLv) {
        document.getElementById('vMatchResult').innerHTML = "すでに最大レベルに達しています。";
        return;
    }

    let currentExp = rankData.cumExp[curLv - 1];
    let reqExp = rankData.totalExp - currentExp;

    let expPerMatch = Math.round(V_ROAD_EXP_BASE[vLevel] * bonus);
    let totalMatches = Math.ceil(reqExp / expPerMatch);
    let laps = (totalMatches / 38).toFixed(1);
    
    let rawEnergyCost = (totalMatches / 38) * (isHalf ? 24.5 : 49);
    let energyCost = Math.round(rawEnergyCost);

    document.getElementById('vMatchResult').innerHTML = `
        <div class="result-title"><span class="badge badge-${rank.toLowerCase()}">${rank}ランク</span> Lv.${curLv} → Lv.${rankData.maxLv}</div>
        必要経験値: <b>${reqExp.toLocaleString()} EXP</b> (1試合あたり約 ${expPerMatch} EXP)<br>
        必要試合数: <span class="highlight">${totalMatches} 試合</span><br>
        Vロード周回数: 約 <b>${laps} 周</b><br>
        全自操作時エナジー消費目安: 約 <b>${energyCost} エナジー</b> ${isHalf ? '<small style="color:#64748b;">(スタ半適用・四捨五入)</small>' : ''}
    `;
}

function toggleStatsLabel() {
    const type = document.getElementById('playerType').value;
    if (type === '野手') {
        document.getElementById('lblStat1').innerText = 'ミート';
        document.getElementById('lblStat2').innerText = 'パワー';
        document.getElementById('lblStat3').innerText = '走力';
    } else {
        document.getElementById('lblStat1').innerText = '球威';
        document.getElementById('lblStat2').innerText = '制球';
        document.getElementById('lblStat3').innerText = 'スタミナ';
    }
}

function calcTitleAssist() {
    const type = document.getElementById('playerType').value;
    const s1 = parseInt(document.getElementById('stat1').value);
    const s2 = parseInt(document.getElementById('stat2').value);
    const s3 = parseInt(document.getElementById('stat3').value);
    const target = document.getElementById('targetEquivalency').value;

    const allTypeTitles = TITLE_DATABASE.filter(t => t.type === type);

    const starCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
    allTypeTitles.forEach(t => starCounts[t.star]++);

    let matchedTitles = [];

    allTypeTitles.forEach(t => {
        let ns1 = s1 + (t.stats.mee || t.stats.kyu || 0);
        let ns2 = s2 + (t.stats.pow || t.stats.sei || 0);
        let ns3 = s3 + (t.stats.run || t.stats.sta || 0);

        let isMatch = false;
        if (target === "1-2" && ns1 === ns2) isMatch = true;
        if (target === "1-3" && ns1 === ns3) isMatch = true;
        if (target === "2-3" && ns2 === ns3) isMatch = true;
        if (target === "all" && ns1 === ns2 && ns2 === ns3) isMatch = true;

        if (isMatch) {
            matchedTitles.push(t);
        }
    });

    let html = `<div class="result-title">同値達成の分析結果</div>`;
    if (matchedTitles.length === 0) {
        html += `現在のステータスから【${target}】同値にできる称号は存在しません。`;
    } else {
        html += `条件に合致する称号が <b>${matchedTitles.length}件</b> 見つかりました：<br>`;
        html += `<div class="title-list">`;
        matchedTitles.forEach(t => {
            html += `<div class="title-item">★${t.star} <b>${t.name}</b></div>`;
        });
        html += `</div>`;

        let bestBooks = 0;
        let maxProbability = -1;

        for (let books = 0; books <= 5; books++) {
            let totalProbForBooks = 0;
            matchedTitles.forEach(t => {
                let starProb = GOKUISHI_PROB_TABLE[books][t.star];
                let singleProb = starProb * (1 / starCounts[t.star]);
                totalProbForBooks += singleProb;
            });

            if (totalProbForBooks > maxProbability) {
                maxProbability = totalProbForBooks;
                bestBooks = books;
            }
        }

        let maxProbPercent = (maxProbability * 100).toFixed(2);

        html += `<br>推奨「極意書」枚数: <span class="highlight">${bestBooks} 冊</span><br>`;
        html += `<small style="color:#64748b;">（最大確率: 約 <b>${maxProbPercent}%</b> で狙いの同値称号が出現します）</small><br>`;
        html += `<small class="note-text">※各レア度内の個別の称号の出現率（1 / 該当レア度の全称号数）× 確率表に基づいて最も確率が高くなる枚数を算出しています。</small>`;
    }

    document.getElementById('titleResult').innerHTML = html;
}

function updateEventDefaults() {
    const evt = document.getElementById('eventSelect').value;
    if (evt === 'Kyushin') {
        document.getElementById('day1Rate').value = "3800";
        document.getElementById('currentRate').value = "5500";
    } else if (evt === 'RealTime') {
        document.getElementById('day1Rate').value = "3200";
        document.getElementById('currentRate').value = "4800";
    } else if (evt === 'Darvish') {
        document.getElementById('day1Rate').value = "4200";
        document.getElementById('currentRate').value = "6000";
    }
}

function predictBorder() {
    const totalDays = parseFloat(document.getElementById('totalDays').value);
    const currentDay = parseFloat(document.getElementById('currentDay').value);
    const day1Rate = parseFloat(document.getElementById('day1Rate').value);
    const currentRate = parseFloat(document.getElementById('currentRate').value);
    const evt = document.getElementById('eventSelect').value;

    if (currentDay < 1 || currentDay > totalDays || day1Rate <= 0) {
        document.getElementById('predictResult').innerHTML = "正しい日数（1日目以上）と初日レートを入力してください。";
        return;
    }

    let endSpurtMultiplier = 1.25; 
    if (evt === 'Darvish') endSpurtMultiplier = 1.35;
    if (evt === 'Kyushin') endSpurtMultiplier = 1.30;

    let dailyGrowthRate = (currentRate - day1Rate) / (currentDay - 1);
    if (currentDay === 1) dailyGrowthRate = day1Rate;

    let remainingDays = totalDays - currentDay;
    let rawPredictedFinal = currentRate + (dailyGrowthRate * remainingDays * (1 + (endSpurtMultiplier - 1) * (remainingDays / totalDays)));

    let predictedFinal = Math.max(0, Math.round(rawPredictedFinal - 400));

    document.getElementById('predictResult').innerHTML = `
        <div class="result-title">最終ボーダー予測結果 (初日比較ベース)</div>
        初日(24h)データ: <b>${day1Rate.toLocaleString()} レート</b><br>
        初日からの増加倍率: <b>${(currentRate / day1Rate).toFixed(2)} 倍</b> (${currentDay}日目時点)<br>
        予測最終ボーダー: <span class="highlight">${predictedFinal.toLocaleString()} レート</span><br>
        <small style="color: #64748b;">※正確ではない可能性があります</small>
    `;
}
